<header class="fixed inset-x-0 top-0 z-50 border-b border-[#0c1a10]/[0.07] bg-[#fbfcfa]/95 backdrop-blur-xl">
  <div class="mx-auto flex h-[74px] max-w-7xl items-center justify-between px-5 sm:px-8">
    <a routerLink="/" class="flex items-center gap-2.5" aria-label="OrderBridge AI home" (click)="closeMenu()">
      <span class="grid size-9 place-items-center rounded-[10px] bg-[#25d366] text-xs font-bold text-[#0c1a10] shadow-[0_8px_24px_rgba(37,211,102,0.22)]">OB</span>
      <span class="text-lg font-semibold tracking-[-0.025em]">OrderBridge</span>
      <span class="rounded bg-[#25d366]/10 px-1.5 py-0.5 text-[10px] font-bold tracking-[0.08em] text-[#07883a]">AI</span>
    </a>

    <nav class="hidden items-center gap-7 text-sm font-medium text-[#55705d] lg:flex" aria-label="Primary navigation">
      @for (item of navigation; track item.route) {
        <a [routerLink]="item.route" routerLinkActive="text-[#0c1a10]" [routerLinkActiveOptions]="{ exact: true }" class="transition-colors hover:text-[#0c1a10]">{{ item.label }}</a>
      }
    </nav>

    <div class="flex items-center gap-2">
      <a routerLink="/book-demo" class="hidden rounded-[10px] bg-[#25d366] px-5 py-2.5 text-sm font-semibold text-[#0c1a10] transition-all hover:-translate-y-0.5 hover:bg-[#20c65e] sm:inline-flex">Book a demo</a>
      <button type="button" class="grid size-10 place-items-center rounded-[10px] border border-[#dce4de] bg-white text-lg lg:hidden" (click)="mobileMenuOpen = !mobileMenuOpen" [attr.aria-expanded]="mobileMenuOpen" aria-controls="mobile-menu" aria-label="Toggle navigation">{{ mobileMenuOpen ? '×' : '☰' }}</button>
    </div>
  </div>

  @if (mobileMenuOpen) {
    <nav id="mobile-menu" class="border-t border-[#e5eae6] bg-white px-5 py-5 lg:hidden" aria-label="Mobile navigation">
      <div class="mx-auto flex max-w-7xl flex-col text-sm font-medium">
        @for (item of navigation; track item.route) {
          <a [routerLink]="item.route" routerLinkActive="text-[#0f9d46]" [routerLinkActiveOptions]="{ exact: true }" class="py-3" (click)="closeMenu()">{{ item.label }}</a>
        }
        <a routerLink="/book-demo" class="mt-3 rounded-[10px] bg-[#25d366] px-5 py-3 text-center font-semibold" (click)="closeMenu()">Book a demo</a>
      </div>
    </nav>
  }
</header>
