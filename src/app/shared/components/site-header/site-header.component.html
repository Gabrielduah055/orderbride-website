<header class="site-header" [class.site-header--scrolled]="scrolled()">
  <div class="header-inner">
    <a routerLink="/" class="brand-link" aria-label="OrderBridge AI home" (click)="closeMenu()">
      <app-brand-logo />
    </a>

    <nav class="desktop-nav" aria-label="Primary navigation">
      @for (item of navigation; track item.route) {
        <a [routerLink]="item.route" routerLinkActive="is-active" [routerLinkActiveOptions]="{ exact: item.route === '/' }">{{ item.label }}</a>
      }
    </nav>

    <div class="header-actions">
      <a routerLink="/book-demo" [queryParams]="utm.queryParams()" class="button button-primary header-cta">Book a demo</a>
      <button
        #menuTrigger
        type="button"
        class="menu-trigger"
        (click)="toggleMenu()"
        [attr.aria-expanded]="mobileMenuOpen()"
        aria-controls="mobile-menu"
        [attr.aria-label]="mobileMenuOpen() ? 'Close navigation' : 'Open navigation'"
      >
        <i class="uil" [class.uil-bars]="!mobileMenuOpen()" [class.uil-times]="mobileMenuOpen()" aria-hidden="true"></i>
      </button>
    </div>
  </div>

  @if (mobileMenuOpen()) {
    <nav id="mobile-menu" class="mobile-menu" aria-label="Mobile navigation" (keydown)="onMenuKeydown($event)">
      @for (item of navigation; track item.route) {
        <a #mobileLink [routerLink]="item.route" routerLinkActive="is-active" [routerLinkActiveOptions]="{ exact: item.route === '/' }" (click)="closeMenu()">{{ item.label }}</a>
      }
      <a #mobileLink routerLink="/book-demo" [queryParams]="utm.queryParams()" class="button button-primary" (click)="closeMenu()">Book a demo</a>
    </nav>
  }
</header>
