<div class="relative mx-auto w-full max-w-[350px]" tabindex="0" aria-label="Interactive example WhatsApp conversation. Hover or focus to scroll through the order." (mouseenter)="scrollConversation(true)" (mouseleave)="scrollConversation(false)" (focus)="scrollConversation(true)" (blur)="scrollConversation(false)">
  <div class="phone-glow absolute -inset-16 -z-10"></div>
  <div class="overflow-hidden rounded-[30px] border-[6px] border-[#17231b] bg-[#111b21] shadow-[0_34px_85px_rgba(12,26,16,0.22)]">
    <div class="flex items-center gap-3 bg-[#1f2c34] px-4 pb-3 pt-4 text-white">
      <span class="grid size-10 place-items-center rounded-full bg-[#25d366] text-sm font-semibold text-[#0c1a10]">AK</span>
      <div class="min-w-0 flex-1"><p class="text-sm font-medium">Accra Kitchen</p><p class="mt-0.5 flex items-center gap-1.5 text-[11px] text-[#6ee69b]"><span class="size-1.5 rounded-full bg-[#25d366]"></span> OrderBridge AI · online</p></div>
      <span class="text-lg text-[#b9c5c9]">⋮</span>
    </div>
    <div #chatScroll class="chat-pattern chat-scroll h-[440px] space-y-2 overflow-y-auto px-3 py-3">
      @for (message of messages; track $index) {
        <div class="flex" [class.justify-end]="message.from === 'customer'" [class.justify-start]="message.from !== 'customer'">
          <div class="max-w-[88%] whitespace-pre-line px-3 py-2 text-[11px] leading-[1.55] text-[#e9edef] shadow-sm" [class.chat-user]="message.from === 'customer'" [class.chat-assistant]="message.from !== 'customer'">{{ message.text }}<div class="mt-1 text-right text-[9px] text-[#98a8af]">{{ message.time }} @if (message.from === 'customer') { <span class="ml-1 text-[#65c7ef]">✓✓</span> }</div></div>
        </div>
      }
    </div>
    <div class="flex items-center gap-2 border-t border-white/5 bg-[#1f2c34] px-3 py-2.5"><span class="flex-1 rounded-full bg-[#2a3942] px-4 py-2 text-[11px] text-[#8696a0]">Message</span><span class="grid size-8 place-items-center rounded-full bg-[#25d366] text-xs text-[#0c1a10]">➤</span></div>
  </div>
  <div class="absolute -bottom-5 -left-10 hidden rounded-xl border border-[#dfe6e1] bg-white px-4 py-3 shadow-[0_18px_40px_rgba(12,26,16,0.13)] sm:flex sm:items-center sm:gap-3"><span class="grid size-8 place-items-center rounded-full bg-[#e4f8eb] font-semibold text-[#0f9d46]">✓</span><div><p class="text-xs font-semibold">Order structured</p><p class="mt-0.5 text-[10px] text-[#6b7d70]">Waiting for restaurant approval</p></div></div>
</div>
