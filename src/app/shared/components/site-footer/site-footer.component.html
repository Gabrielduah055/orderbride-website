<footer class="site-footer">
  <div class="page-container footer-grid">
    <div class="footer-brand">
      <a routerLink="/" aria-label="OrderBridge AI home"><app-brand-logo [reversed]="true" /></a>
      <p>{{ tagline }}</p>
      <p class="footer-note">Built in Ghana for food businesses that already sell through conversation.</p>
    </div>
    <nav class="footer-nav" aria-label="Footer navigation">
      @for (item of navigation; track item.route) {
        <a [routerLink]="item.route">{{ item.label }}</a>
      }
    </nav>
  </div>
  <div class="page-container footer-bottom">
    <p>© {{ currentYear }} {{ siteName }}. All rights reserved.</p>
    <p>Conversations into confirmed orders.</p>
  </div>
</footer>
